<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>blog</title>
<style>
  header { 
          background-color: #9370DB;
          color: #FFFFFF; 
          text-align: center;
          max-width: 800px;
          margin: 0 auto;
          padding: 16px;
          border: 5px solid #000000;
  }  
  main {
        background-color: #FFFFFF;
        color: #000000;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        display: flex; 
        gap: 16px;
  }
  img {
     width: 300px;
     height: 300px; 
     object-fit: cover;
     flex-shrink: 0;
  }
  .artigo-autor {
     font-weight: bold;
  }
  
  /* ESTILOS DOS BOTÕES */
  .botoes-reacao {
     display: flex;
     gap: 10px;
     margin-top: 15px;
  }
  .btn {
     padding: 8px 16px;
     font-size: 14px;
     border: 2px solid #000000;
     border-radius: 4px;
     cursor: pointer;
     font-weight: bold;
     transition: background-color 0.2s;
  }
  .btn-like {
     background-color: #4CAF50;
     color: white;
  }
  .btn-like:hover {
     background-color: #45a049;
  }
  .btn-dislike {
     background-color: #f44336;
     color: white;
  }
  .btn-dislike:hover {
     background-color: #da190b;
  }
</style>   
</head>
  <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou mostrar minhas bandas favoritas, o porquê e o meu álbum favorito de cada uma</p> 
        </header>
        
        <main>  
            <img src="megadeth-logo.jpeg" alt="megadeth sick logo">  
            
            <div>  
                <h2>Meu primeiro post</h2> 
                <p class="artigo-autor">Por: Alexandre de Moraes</p>
                <p>Boas-vindas ao meu blog bacana, aqui falaremos sobre bandas que gosto</p>
                
                <!-- BOTÕES COM IDS E SPANS PARA A NUMERAÇÃO -->
                <div class="botoes-reacao">
                    <button class="btn btn-like" id="btn-like">
                        👍 Like (<span id="num-likes">0</span>)
                    </button>
                    <button class="btn btn-dislike" id="btn-dislike">
                        👎 Dislike (<span id="num-dislikes">0</span>)
                    </button>
                </div>
            </div>
        </main>

    <!-- SCRIPT JAVASCRIPT QUE FAZ A CONTAGEM FUNCIONAR -->
    <script>
        // Criando as variáveis para guardar a quantidade de cliques
        let qtdLikes = 0;
        let qtdDislikes = 0;

        // Pegando os elementos do HTML
        const botaoLike = document.getElementById('btn-like');
        const botaoDislike = document.getElementById('btn-dislike');
        const spanLikes = document.getElementById('num-likes');
        const spanDislikes = document.getElementById('num-dislikes');

        // Função para quando clicar em Like
        botaoLike.addEventListener('click', () => {
            qtdLikes++; // Soma +1
            spanLikes.innerText = qtdLikes; // Atualiza o número na tela
        });

        // Função para quando clicar em Dislike
        botaoDislike.addEventListener('click', () => {
            qtdDislikes++; // Soma +1
            spanDislikes.innerText = qtdDislikes; // Atualiza o número na tela
        });
    </script>
</body> 
</html>
